version: "3.9"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: semantic_fabric_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-semantic_fabric}
      POSTGRES_USER: ${POSTGRES_USER:-fabric_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me_in_production}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fabric_admin} -d ${POSTGRES_DB:-semantic_fabric}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
