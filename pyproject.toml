[project]
name = "semantic-data-fabric-analyst"
version = "0.1.0"
description = "Privacy-preserving Semantic Data Fabric and Autonomous Analyst powered by local LLMs and PostgreSQL."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
